name: Publish to npm

# Publishes on every git tag matching v* (e.g. v0.1.0).
#
# `NPM_TOKEN` must be an npm Automation token with publish rights to the
# @nowah scope. (Upstream used a secret named ORBS, which doesn't exist here.)
# `--provenance` requires id-token: write and an HTTPS registry-url.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # never publish something that doesn't pass
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # `access: public` comes from publishConfig in package.json, which a
      # scoped package needs in order to publish publicly
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
